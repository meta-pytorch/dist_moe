name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked CPU tools
        run: python -m pip install --requirement .github/requirements/ci-cpu.txt
      - name: Check source and repository metadata
        run: pre-commit run --all-files
      - name: Check dependency locks
        run: |
          uv pip compile .github/requirements/ci-cpu.in \
            --python-platform x86_64-manylinux_2_28 \
            --python-version 3.12 \
            -o .github/requirements/ci-cpu.txt
          git diff --exit-code -- .github/requirements
      - name: Build and inspect distributions
        run: |
          python -m build --no-isolation
          twine check dist/*
          DIST_MOE_ARTIFACT_DIR=dist python -m pytest -q \
            tests/test_package_boundary.py::StaticPackageBoundaryTest \
            tests/test_package_boundary.py::DistributionArtifactTest
          (cd dist && sha256sum dist_moe-* > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
