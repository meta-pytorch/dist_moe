[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-moe"
version = "0.1.0"
description = "CuTe DSL distributed mixture-of-experts kernels for PyTorch"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Meta Platforms, Inc."},
]
keywords = ["cuda", "cute-dsl", "distributed", "mixture-of-experts", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "apache-tvm-ffi>=0.1.10,<0.2",
    "cuda-python>=13.1,<14",
    "nvidia-cutlass-dsl[cu13]>=4.6.0.dev0,<=4.8.0",
    "packaging",
    "torch>=2.14",
    "triton>=3.8,<3.9",
]

[project.urls]
Homepage = "https://github.com/meta-pytorch/dist_moe"
Documentation = "https://github.com/meta-pytorch/dist_moe/tree/main/docs"
Issues = "https://github.com/meta-pytorch/dist_moe/issues"
Repository = "https://github.com/meta-pytorch/dist_moe"

[tool.setuptools.packages.find]
include = ["dist_moe*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "distribution_artifact: requires built wheel and source-distribution artifacts",
    "gb10x: requires an NVIDIA GPU with compute capability 10.x or newer",
    "gpus_needed_1: requires at least one GPU",
    "gpus_needed_2: requires at least two GPUs",
]
